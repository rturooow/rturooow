name: Update profile graphics

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create image folder
        run: mkdir -p profile

      - name: Generate contribution image
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rturooow
          outputs: |
            profile/github-contribution-snake.svg?color_snake=#b8b8b8&color_dots=#242424,#393939,#545454,#707070,#909090

      - name: Install banner image dependencies
        run: python -m pip install --disable-pip-version-check CairoSVG==2.9.1 Pillow==13.0.0

      - name: Generate animated banner
        run: python scripts/generate_banner_gif.py

      - name: Generate GitHub stats card
        run: python scripts/generate_profile_stats.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/banner.gif profile/github-contribution-snake.svg profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile graphics"
          git push
